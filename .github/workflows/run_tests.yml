name: Run Tests
on:
  push:
    branches: [main]
  pull_request:
permissions: {}
jobs:
  Run-PostgreSQL-Tests:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - search_path: slim,gdm_vocabs
            data_model: gdm
          - search_path: slim,ohdsi_vocabs
            data_model: gdm
          - search_path: wide,slim,ohdsi_vocabs
            data_model: gdm_wide
    runs-on: ubuntu-latest
    env:
      SEQUELIZER_SEARCH_PATH: ${{ matrix.search_path }}
      CONCEPTQL_DATA_MODEL: ${{ matrix.data_model }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Log into DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Run Tests
        run: docker compose run conceptql
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.data_model }}-${{ matrix.search_path }}
          path: coverage/
          retention-days: 90
  Run-Spark-Tests:
    permissions:
      contents: read
    strategy:
      matrix:
        #spark_version: [3.5.0, 3.3.2]
        spark_version: [3.5.7, 4.0.1]
        vocabs: [ohdsi, ohdsi_wide]
        include:
          - vocabs: ohdsi
            search_path: slim,ohdsi_vocabs
            data_model: gdm
          - vocabs: ohdsi_wide
            search_path: wide,slim,ohdsi_vocabs
            data_model: gdm_wide
    runs-on: ubuntu-22.04
    env:
      SPARK_VERSION: ${{ matrix.spark_version }}
      CONCEPTQL_DATA_MODEL: ${{ matrix.data_model }}
      BUNDLE_WITH: hexspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ startsWith(matrix.spark_version, '4.') && '17' || '11' }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/spark-${{ matrix.spark_version }}
          key: spark-${{ env.SPARK_VERSION }}
        id: cache-spark
      - name: Download Spark
        if: steps.cache-spark.outputs.cache-hit != 'true'
        run: |
          wget -q "https://archive.apache.org/dist/spark/spark-${SPARK_VERSION}/spark-${SPARK_VERSION}-bin-hadoop3.tgz"
          tar xzf "spark-${SPARK_VERSION}-bin-hadoop3.tgz"
          mv "spark-${SPARK_VERSION}-bin-hadoop3" ~/"spark-${SPARK_VERSION}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/synpuf_test_data
          key: synpuf-test-data-v8
        id: cache-synpuf-test-data
      - name: Download Data
        if: steps.cache-synpuf-test-data.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          curl -sSL "https://www.dropbox.com/scl/fi/bflehlmk1itwd352z0kjk/synpuf_test_data.tgz?rlkey=ogticol20oxvis5yzq37878z7&st=vydvpdyw&dl=1" > synpuf_test_data.tgz
          tar xzf synpuf_test_data.tgz

      - run: ~/"spark-${SPARK_VERSION}"/sbin/start-thriftserver.sh --driver-memory 5G && sleep 20
      - run: bundle exec ruby test/all.rb
        env:
          CONCEPTQL_PARQUET_TEST_DIR: '/tmp/synpuf_test_data/{${{ matrix.search_path }}}'
          SEQUELIZER_URL: hexspace://localhost:10000/default
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-spark-${{ matrix.spark_version }}-${{ matrix.data_model }}
          path: coverage/
          retention-days: 90
  Run-DuckDB-Tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      SEQUELIZER_SEARCH_PATH: wide,slim,ohdsi_vocabs
      CONCEPTQL_DATA_MODEL: gdm_wide
      BUNDLE_WITH: duckdb
      DUCKDB_VERSION: 1.5.0
      DUCKDB_LIB_DIR: /tmp/libduckdb
      DUCKDB_TEST_DATA_PATH: /tmp/synpuf_test_data.duckdb
      DUCKDB_TEST_DATA_URL: ${{ vars.DUCKDB_TEST_DATA_URL }}
      DUCKDB_TEST_DATA_URL_SECRET: ${{ secrets.DUCKDB_TEST_DATA_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive DuckDB Version
        run: |
          version="$(ruby -e '
            in_gem = false
            File.foreach("Gemfile.lock") do |line|
              in_gem = true if line == "GEM\n"
              next unless in_gem
              if line =~ /^    duckdb \(([^)]+)\)/
                puts Regexp.last_match(1).split(".")[0, 3].join(".")
                exit 0
              end
            end
            exit 1
          ')"
          echo "DUCKDB_VERSION=$version" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '3.4'
      - name: Install libduckdb
        run: |
          curl -fsSL \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/libduckdb-linux-amd64.zip" \
            -o /tmp/libduckdb.zip
          rm -rf "$DUCKDB_LIB_DIR"
          mkdir -p "$DUCKDB_LIB_DIR"
          unzip -q /tmp/libduckdb.zip -d "$DUCKDB_LIB_DIR"
          echo "BUNDLE_BUILD__DUCKDB=--with-duckdb-include=$DUCKDB_LIB_DIR --with-duckdb-lib=$DUCKDB_LIB_DIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$DUCKDB_LIB_DIR:${LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - run: bundle install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/synpuf_test_data.duckdb
          # Keyed on the checksum of the fixture, not on this workflow file, so
          # the key tracks the DATA. Publishing a new fixture means updating
          # .github/synpuf_test_data.sha256, which invalidates the cache by
          # itself; editing this YAML no longer forces a 2 GB re-download.
          key: synpuf-test-data-duckdb-${{ hashFiles('.github/synpuf_test_data.sha256') }}
        id: cache-synpuf-test-data-duckdb
      - name: Download DuckDB Data
        if: steps.cache-synpuf-test-data-duckdb.outputs.cache-hit != 'true'
        run: |
          url="${DUCKDB_TEST_DATA_URL:-$DUCKDB_TEST_DATA_URL_SECRET}"
          if [ -z "$url" ]; then
            echo "Missing DUCKDB_TEST_DATA_URL repo variable or secret"
            exit 1
          fi
          # -f so an HTTP error is an error. Without it curl happily writes the
          # body of an error page to the file: when the Dropbox share behind
          # this URL was deleted, every run downloaded a 189 KB HTML page titled
          # "Dropbox - File Deleted", passed the old `test -s` check, and failed
          # much later as "not a valid DuckDB database file".
          curl -fsSL --retry 3 --retry-delay 5 "$url" -o "$DUCKDB_TEST_DATA_PATH"

      # Runs on cache hit as well as after a download, so a truncated or stale
      # cached fixture is caught here rather than inside the test run.
      - name: Verify DuckDB Data
        run: |
          # Magic-byte check first, purely for a readable failure. A dead or
          # permission-gated Dropbox link answers 200 with an HTML page, which
          # -f cannot catch and a size test happily accepts; the checksum below
          # would reject it, but only after hashing 2 GB and with a message that
          # says nothing about what actually went wrong.
          magic=$(dd if="$DUCKDB_TEST_DATA_PATH" bs=1 skip=8 count=4 2>/dev/null)
          if [ "$magic" != "DUCK" ]; then
            echo "Not a DuckDB file: magic at offset 8 is '$magic', expected 'DUCK'."
            echo "First bytes were:"
            head -c 200 "$DUCKDB_TEST_DATA_PATH"
            exit 1
          fi
          cd "$(dirname "$DUCKDB_TEST_DATA_PATH")"
          sha256sum -c "${GITHUB_WORKSPACE}/.github/synpuf_test_data.sha256"
      - run: bundle exec ruby test/all.rb
        env:
          SEQUELIZER_URL: duckdb://${{ env.DUCKDB_TEST_DATA_PATH }}
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-duckdb-${{ env.CONCEPTQL_DATA_MODEL }}
          path: coverage/
          retention-days: 90
  ci:
    if: always()
    permissions: {}
    needs: [Run-PostgreSQL-Tests, Run-Spark-Tests, Run-DuckDB-Tests]
    runs-on: ubuntu-latest
    steps:
      # Allowlists success: a skipped, cancelled or failed needed job (or any
      # result GitHub adds later) fails this job, and so does an empty list.
      # A skipped job ran no tests, so a green here must not hide it.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          [[ -n "$RESULTS" ]] || { echo "no needed job results; refusing to report green"; exit 1; }
          for result in $RESULTS; do
            [[ "$result" == "success" ]] || { echo "a needed job ended '$result'; refusing to report green"; exit 1; }
          done
          echo "All CI jobs passed"
