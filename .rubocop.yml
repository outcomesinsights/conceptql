# Every Ruby repo, gems and apps alike (seed gator-rga.1, ruled 2026-10-02). Copy as
# .rubocop.yml; the three lines marked PER REPO are the only ones that change.
#
# omakase is what `rails new` writes. It is NOT a whitelist: it disables TEN of RuboCop's
# departments BY NAME (Bundler, Gemspec, Layout, Lint, Metrics, Naming, Performance, Rails,
# Security, Style) and re-enables 44 Layout/Style cops inside them -- no Metrics, no
# Documentation, the shape the Ruby core team's own configs have. A department it does NOT
# name keeps its full default cop set, and every plugin on the PER REPO line below is such a
# department: measured in sequel-hexspace (gator-b2m), rubocop-minitest 0.40.0 runs 51 of its
# 55 cops under this config, while rubocop-rails runs 0 of 138 because Rails IS named. So the
# plugins line is load-bearing, not decorative: each plugin brings its whole default set, and
# an unwanted plugin cop is disabled below with a one-line reason (rule 6), never by dropping
# the plugin. Measured by RUNNING `rubocop -a` on scratch copies, never by counting the JSON
# `correctable` flag (that includes unsafe corrections -a refuses; it overstated
# sequel-hexspace's yield, gator-no5): summarb and sequel-duckdb -> 0 left; sequel-hexspace
# 5,530 of 5,544 corrected, 14 by hand (11 Lint/AssignmentInCondition, unsafe-only).
# It leaves Lint OFF; the one addition below turns it on (49 real bugs fleet-wide when
# measured). No .rubocop_todo.yml: delete it, autocorrect, fix the rest by hand, one commit,
# .git-blame-ignore-revs.
inherit_gem: { rubocop-rails-omakase: rubocop.yml }
plugins: [rubocop-minitest, rubocop-rake, rubocop-sequel]
Lint:
  Enabled: true
AllCops:
  # omakase curates new cops (they arrive with its gem bump), so this knob only reaches
  # pending cops in Lint and the plugins: `enable` measured 111 offenses on sequel-duckdb,
  # 108 of them Minitest/MultipleAssertions, a judgment cop. `disable` also silences the
  # "not configured" notice RuboCop prints every run when the line is absent.
  NewCops: disable
  TargetRubyVersion: 3.3
  Exclude: [vendor/**/*, bin/**/*, tmp/**/*, claude_stuff/**/*]
