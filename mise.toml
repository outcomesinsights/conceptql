# Tool pins for this repo's recipes, assembled from gator's standard/mise.toml
# (ruled 2026-10-02). `just setup` runs `mise install`; a clone needs only git
# and mise. Pins are major-only and copied byte for byte from the standard.
# rubocop travels in the Gemfile; mdformat runs through uvx (the treefmt block).

[tools]
just = "1"
uv = "0"
"aqua:numtide/treefmt" = "2"
shfmt = "3"
# prettier uses mise's npm backend, which installs no node, so node is pinned too (gator-ncm).
node = "24"
prettier = "3"
taplo = "0"
shellcheck = "0"
"aqua:rhysd/actionlint" = "1"
zizmor = "1"
cocogitto = "7"
hadolint = "2"
# The diagram renderer's resvg (ConceptQL::DiagramRenderer::Resvg::VERSION), for
# `just test-diagram` and `just spec`. This pin is exact, not major-only like the others: the
# test references were measured with 0.33.0, and resvg 0.34 fails the
# bounding-box check on all 70 fixtures.
"github:linebender/resvg" = "0.33.0"
